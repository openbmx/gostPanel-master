name: Build and Package

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  scripts:
    name: Shell Scripts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Syntax check
      run: |
        for f in scripts/*.sh scripts/tests/*.sh; do
          bash -n "$f" && echo "OK $f"
        done

    # 升级脚本的布局迁移在临时目录里演练一遍：
    # 这段逻辑只在存量用户升级时才会跑到，出问题的代价很高，
    # 但它本身不依赖 root/systemd/网络，完全可以在 CI 中验证。
    - name: Upgrade migration dry-run
      run: bash scripts/tests/upgrade-migration-test.sh

  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    # 前端产物是 embed 进二进制的，编译前必须让 dist 目录存在
    - name: Prepare embed target
      run: mkdir -p internal/router/dist && touch internal/router/dist/index.html

    - name: go vet
      run: go vet ./...

    # 安全回归测试（密码重启保留、Token 吊销、上报鉴权、限流边界等）在这里执行。
    # 此前 CI 只编译不跑测试，等于这些护栏在流水线上完全不生效。
    - name: Unit tests
      run: go test -count=1 ./...

    # 版本需与 .golangci.yml 的 `version: "2"` 配置格式匹配：
    # golangci-lint v1.x 无法解析 v2 配置。这里固定为本地验证过的版本。
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout=10m

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [test, scripts]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Frontend
      run: |
        cd web
        npm ci
        npm run build
        cd ..

    - name: Build Backend (Linux amd64)
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o gost-panel-linux-amd64 cmd/server/main.go

    - name: Build Backend (Linux arm64)
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o gost-panel-linux-arm64 cmd/server/main.go
    
    # 如果你也想编译 Windows 版本，可以取消注释以下行
    # - name: Build Backend (Windows amd64)
    #   run: |
    #     CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o gost-panel-windows-amd64.exe cmd/server/main.go

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gost-panel-binaries
        path: |
          gost-panel-linux-amd64
          gost-panel-linux-arm64
          # gost-panel-windows-amd64.exe

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    # Docker 构建通常需要推送可以推送到 ghcr.io 或 DockerHub
    # 这里我们只演示构建过程，确保 Dockerfile 是没问题的
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false # 设置为 true 需要配置 login
        tags: gost-panel:latest
