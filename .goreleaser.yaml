version: 2

project_name: gost-panel

builds:
  - id: gost-panel
    main: ./cmd/server
    binary: gost-panel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM 没有实际用户，构建它只是徒增发布体积
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      # 版本号注入点必须与 internal/config.Version 一致：
      # 面板内的在线更新用它与 GitHub 上的最新 release 做比较，
      # 注入失败会让版本变成 "dev"，在线更新随之被判定为"非发布构建"而拒绝。
      - -X gost-panel/internal/config.Version={{ .Version }}

archives:
  - id: default
    # 压缩包名称刻意保持与历史一致（gost-panel-linux-amd64.tar.gz）。
    #
    # goreleaser 的默认模板是 name_version_os_arch（下划线），换用默认值会同时
    # 破坏三处：install_panel.sh / upgrade_panel.sh 拼接的下载地址，以及面板内
    # 更新器按 "-{os}-{arch}" 匹配资产的逻辑。旧版本的脚本仍在用户机器上运行，
    # 改名等于让他们的升级直接 404。
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      # 附带默认配置供全新安装参考。
      # 注意：面板内更新器只提取二进制、绝不解包这个文件，
      # 否则会覆盖用户已配置的 JWT 密钥与管理员设置。
      - config/config.yaml

checksum:
  # 文件名与在线更新器、升级脚本中查找的名字一致。
  # 这是完整性校验的唯一依据：缺失它时二者都会拒绝安装。
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  # 不自动生成提交列表，完全使用 tag 附注消息作为更新说明。
  # 面板的「版本与更新」页直接展示 release body，提交列表对用户没有意义。
  disable: true

# 注：goreleaser 已把 dockers/docker_manifests 标记为逐步淘汰，未来会由
# dockers_v2 取代。这里暂不迁移 —— workflow 中固定了 goreleaser 版本，
# 当前语法在该版本上工作正常；等升级 goreleaser 版本时再一并迁移。
dockers:
  - id: ghcr-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - scripts/docker-entrypoint.sh
      - config
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"

  - id: ghcr-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - scripts/docker-entrypoint.sh
      - config
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"

# 多架构 manifest：用户 docker pull 时按自身架构自动选择
docker_manifests:
  # 精确版本标签始终推送，预发布也可以按 :1.1.0-rc1 拉取验证
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}-arm64"

  # 以下三个是浮动标签，预发布时必须跳过（skip_push: auto）。
  # 否则一个 rc 版本会顶掉 :latest，所有按 :latest 部署的用户
  # 会在下次 pull 时静默升到未验证的预发布版本。
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}-arm64"

  # 次版本与主版本浮动标签，便于用户按 :1.1 / :1 跟随补丁更新
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Major }}.{{ .Minor }}"
    skip_push: auto
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}-arm64"

  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Major }}"
    skip_push: auto
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}-arm64"

release:
  draft: false
  # auto：tag 带预发布标识（如 v1.1.0-rc1）时发为 preview，否则发正式版。
  #
  # 这正是想要的语义：GitHub 的 /releases/latest 不返回 preview，
  # 而面板的更新检查走的就是该接口 —— 预发布因此不会被推送给普通用户，
  # 可以安全地用来验证发布流程。
  # 反过来固定成 false 更危险：一个误打的 -rc1 tag 会被当作正式版发布，
  # 并抢走 :latest 标签直接推给所有用户。
  prerelease: auto
  name_template: "Gost Panel {{ .Version }}"
  # release 正文即 tag 的附注消息，面板「版本与更新」页会原样展示。
  # 打 tag 时请写清楚改了什么：git tag -a v1.2.0 -m "标题" -m "详细说明"
  header: |
    {{ .Env.TAG_MESSAGE }}
  footer: |

    ---

    ## 📥 安装与升级

    **面板内在线更新**（推荐）：系统管理 → 版本与更新 → 一键升级

    **升级脚本：**
    ```bash
    bash <(curl -sSL https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/main/scripts/upgrade_panel.sh)
    ```

    **全新安装：**
    ```bash
    bash <(curl -sSL https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/main/scripts/gost.sh)
    ```

    **Docker：**
    ```bash
    docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/gostpanel:{{ .Version }}
    ```

    ## 🔐 完整性校验

    所有产物的 SHA256 见 `checksums.txt`。升级脚本与面板内更新均会强制校验，
    校验失败会中止安装。手动校验：

    ```bash
    sha256sum -c checksums.txt --ignore-missing
    ```
