name: Security Scan

on:
  push:
  pull_request:
  schedule:
    # 每周一 03:17 UTC 定时复扫。
    # 定时扫描是关键：多数依赖漏洞是在代码没有任何改动的情况下被披露的，
    # 只在 push 时扫会让一个仓库在无人提交期间长期带着已知漏洞。
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  backend-vulncheck:
    name: Go 依赖与代码漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 前端产物是 embed 的，govulncheck 需要 dist 目录存在才能构建
      - name: Prepare embed target
        run: mkdir -p internal/router/dist && touch internal/router/dist/index.html

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-audit:
    name: 前端依赖漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # npm audit 命中高危时退出码非 0，这里先落盘再由脚本判定，
      # 以便区分"有已登记例外"和"真的出现新漏洞"
      - name: Run npm audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high --json > audit.json || true

      - name: Check audit exceptions
        run: |
          python3 tools/check_npm_audit_exceptions.py \
            --audit web/audit.json \
            --exceptions .github/audit-exceptions.yml
